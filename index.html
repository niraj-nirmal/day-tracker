<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03040b">
  <meta name="description" content="A daily record of one moment in time, rendered as a cosmic observatory.">
  <meta name="generated-at" content="2026-09-29T08:16:59+01:00">
  <title>Day Tracker — 29 September 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --space: #03040b;
      --space-mid: #090b1a;
      --violet: #191238;
      --star: #f7f4ee;
      --muted: rgba(247, 244, 238, 0.58);
      --faint: rgba(247, 244, 238, 0.16);
      --line: rgba(247, 244, 238, 0.20);
      --line-strong: rgba(247, 244, 238, 0.34);
      --glow: rgba(186, 171, 255, 0.24);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 74% 22%, rgba(112, 82, 166, 0.17), transparent 30%),
        radial-gradient(circle at 18% 74%, rgba(56, 78, 138, 0.14), transparent 34%),
        linear-gradient(145deg, var(--space) 0%, var(--space-mid) 52%, #05050d 100%);
      color: var(--star);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -18vmax;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 15% 20%, rgba(247,244,238,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 80% 15%, rgba(247,244,238,.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 35% 72%, rgba(247,244,238,.62) 0 1px, transparent 1.4px),
        radial-gradient(circle at 62% 48%, rgba(247,244,238,.38) 0 .8px, transparent 1.3px),
        radial-gradient(circle at 90% 72%, rgba(247,244,238,.52) 0 1px, transparent 1.5px),
        radial-gradient(circle at 12% 82%, rgba(247,244,238,.36) 0 .8px, transparent 1.3px);
      background-size: 220px 210px, 310px 290px, 260px 330px, 190px 240px, 360px 320px, 280px 250px;
      opacity: .56;
      animation: star-drift 90s linear infinite;
    }

    body::after {
      background:
        radial-gradient(ellipse at 50% 50%, rgba(124, 95, 194, .10), transparent 48%),
        radial-gradient(ellipse at 30% 72%, rgba(66, 102, 170, .08), transparent 42%);
      filter: blur(30px);
      opacity: .8;
      animation: nebula-breathe 36s ease-in-out infinite alternate;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      isolation: isolate;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: .69rem;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand,
    .status {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
    }

    .signal {
      width: .45rem;
      height: .45rem;
      border-radius: 999px;
      background: var(--star);
      box-shadow: 0 0 18px rgba(247,244,238,.58);
    }

    .hero {
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 4.75rem) 0;
    }

    .orbit-stage {
      position: relative;
      width: min(82vw, 780px);
      aspect-ratio: 1 / .84;
      display: grid;
      place-items: center;
    }

    .halo {
      position: absolute;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(247,244,238,.055), rgba(158,128,228,.035) 38%, transparent 66%);
      filter: blur(8px);
      box-shadow: 0 0 120px rgba(128,104,189,.10);
    }

    .orbit,
    .orbit::before,
    .orbit::after {
      position: absolute;
      inset: 11% 5%;
      border: 1px solid var(--line);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .orbit {
      animation: orbit-turn 84s linear infinite;
      box-shadow: inset 0 0 30px rgba(255,255,255,.01), 0 0 34px rgba(144,119,201,.04);
    }

    .orbit::before,
    .orbit::after {
      content: "";
      inset: 10% 6%;
    }

    .orbit::before {
      transform: rotate(23deg);
      border-color: rgba(247,244,238,.09);
    }

    .orbit::after {
      inset: 19% 14%;
      transform: rotate(-31deg);
      border-color: rgba(247,244,238,.065);
    }

    .marker-track {
      position: absolute;
      inset: 11% 5%;
      border-radius: 50%;
      animation: marker-turn 31s linear infinite;
      transform: rotate(-12deg);
    }

    .marker {
      position: absolute;
      left: 50%;
      top: -4px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background: var(--star);
      box-shadow: 0 0 8px var(--star), 0 0 24px rgba(173,153,255,.72);
    }

    .content {
      position: relative;
      display: grid;
      justify-items: center;
      text-align: center;
      z-index: 2;
    }

    .eyebrow {
      margin: 0 0 .75rem;
      font-size: clamp(.68rem, 1.2vw, .82rem);
      font-weight: 600;
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .day {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(7rem, 23vw, 15rem);
      font-weight: 400;
      line-height: .72;
      letter-spacing: -.065em;
      text-indent: -.055em;
      text-shadow: 0 0 55px rgba(247,244,238,.08);
    }

    .month-year {
      margin: clamp(1.15rem, 2.8vw, 1.9rem) 0 0;
      font-size: clamp(.72rem, 1.4vw, .92rem);
      font-weight: 600;
      letter-spacing: .31em;
      text-transform: uppercase;
      color: rgba(247,244,238,.82);
    }

    .divider {
      width: clamp(52px, 8vw, 86px);
      height: 1px;
      margin: clamp(1.6rem, 3vw, 2.35rem) 0;
      background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    }

    .time {
      display: flex;
      align-items: baseline;
      gap: .65rem;
      margin: 0;
    }

    .clock {
      font-size: clamp(1.8rem, 4.8vw, 3.2rem);
      font-weight: 300;
      letter-spacing: .06em;
    }

    .zone {
      font-size: clamp(.64rem, 1.2vw, .75rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .caption {
      margin: .9rem 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(.95rem, 2vw, 1.15rem);
      font-style: italic;
      color: rgba(247,244,238,.56);
    }

    .footer {
      align-items: flex-end;
    }

    .coords {
      line-height: 1.8;
    }

    .observation {
      text-align: right;
      line-height: 1.65;
    }

    .observation strong {
      display: block;
      color: rgba(247,244,238,.82);
      font-weight: 500;
    }

    @keyframes orbit-turn {
      to { transform: rotate(348deg); }
    }

    @keyframes marker-turn {
      to { transform: rotate(348deg); }
    }

    @keyframes star-drift {
      to { transform: translate3d(4vmax, 2vmax, 0) rotate(.25deg); }
    }

    @keyframes nebula-breathe {
      from { transform: scale(.96) translate3d(-1%, 0, 0); opacity: .58; }
      to { transform: scale(1.07) translate3d(1.5%, -1%, 0); opacity: .95; }
    }

    @media (max-width: 640px) {
      .page { padding: 1.15rem; }
      .topbar { font-size: .58rem; letter-spacing: .16em; }
      .status span:last-child { display: none; }
      .orbit-stage { width: 95vw; max-width: 620px; aspect-ratio: 1 / 1.1; }
      .orbit, .marker-track { inset: 18% 4%; }
      .orbit::before { inset: 8% 5%; }
      .orbit::after { inset: 18% 13%; }
      .footer { font-size: .56rem; letter-spacing: .14em; }
      .coords span:nth-child(2) { display: none; }
    }

    @media (max-height: 690px) and (min-width: 641px) {
      .hero { padding: 1rem 0; }
      .orbit-stage { width: min(66vw, 590px); }
      .day { font-size: clamp(6rem, 19vw, 11rem); }
      .divider { margin: 1.2rem 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Day Tracker observatory header">
      <div class="brand">
        <span class="signal" aria-hidden="true"></span>
        <span>Day Tracker</span>
      </div>
      <div class="status" aria-label="Observation status">
        <span>Observation 001</span>
        <span>·</span>
        <span>Earth / Sol</span>
      </div>
    </header>

    <section class="hero" aria-labelledby="observation-date">
      <div class="orbit-stage">
        <div class="halo" aria-hidden="true"></div>
        <div class="orbit" aria-hidden="true"></div>
        <div class="marker-track" aria-hidden="true"><span class="marker"></span></div>

        <div class="content">
          <p class="eyebrow">Tuesday</p>
          <time id="observation-date" datetime="2026-09-29T08:16:59+01:00">
            <span class="day" aria-hidden="true">29</span>
            <span class="month-year">September 2026</span>
            <span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Tuesday, 29 September 2026 at 08:16 British Summer Time</span>
          </time>
          <div class="divider" aria-hidden="true"></div>
          <p class="time" aria-label="Recorded time 08:16 British Summer Time">
            <span class="clock">08:16</span>
            <span class="zone">BST · London</span>
          </p>
          <p class="caption">A moment, recorded.</p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="coords" aria-label="Cosmic reference">
        <span>Earth · Sol III</span><br>
        <span>Local frame · Europe/London</span>
      </div>
      <div class="observation">
        <span>Last observation</span>
        <strong>29 Sep 2026 · 08:16 BST</strong>
      </div>
    </footer>
  </main>
</body>
</html>
